[project]
name = "eci-api"
version = "0.1.0"
description = "ECI FastAPI backend."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "eci-observability",
    "eci-storage",
    "eci-ingest",
    "eci-llm",
    "eci-compression",
    "eci-retrieval",
    "eci-execution",
]

[tool.uv.sources]
eci-observability = { workspace = true }
eci-storage = { workspace = true }
eci-ingest = { workspace = true }
eci-llm = { workspace = true }
eci-compression = { workspace = true }
eci-retrieval = { workspace = true }
eci-execution = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eci_api"]
