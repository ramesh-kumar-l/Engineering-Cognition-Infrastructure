services:
  api:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-eci}/eci-api:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    ports:
      - "8000:8000"
    environment:
      ECI_DB_URL: postgresql+psycopg://eci:${POSTGRES_PASSWORD}@postgres:5432/eci
      ECI_OTEL_ENDPOINT: http://otel-collector:4317
      ECI_PROMETHEUS_PORT: "9464"
      ECI_BLOB_BACKEND: ${ECI_BLOB_BACKEND:-local}
      ECI_BLOB_ROOT: /data/blobs
      ECI_BLOB_S3_BUCKET: ${ECI_BLOB_S3_BUCKET:-}
      ECI_BLOB_S3_REGION: ${ECI_BLOB_S3_REGION:-us-east-1}
      ECI_IDENTITY_LOCAL_JWT_SECRET: ${ECI_JWT_SECRET}
    volumes:
      - eci_blobs:/data/blobs
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: eci
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: eci
    volumes:
      - eci_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eci"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ../alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "9093:9093"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  eci_pgdata:
  eci_blobs:
  prometheus_data:
  alertmanager_data:
  grafana_data:
