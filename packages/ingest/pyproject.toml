[project]
name = "eci-ingest"
version = "0.1.0"
description = "ECI ingestion pipeline: parse, hash, store, audit."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "pypdf>=4.3.0",
    "python-frontmatter>=1.1.0",
    "eci-observability",
    "eci-storage",
]

[tool.uv.sources]
eci-observability = { workspace = true }
eci-storage = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eci_ingest"]
