[project]
name = "eci-storage"
version = "0.1.0"
description = "ECI persistence: SQLAlchemy models + Alembic migrations."
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "eci-observability",
]

[tool.uv.sources]
eci-observability = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eci_storage"]
