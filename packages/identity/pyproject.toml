[project]
name = "eci-identity"
version = "0.1.0"
description = "ECI identity: tenants, users, RBAC, OIDC, JWT."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.27.0",
    "eci-observability",
    "eci-storage",
]

[tool.uv.sources]
eci-observability = { workspace = true }
eci-storage = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eci_identity"]
