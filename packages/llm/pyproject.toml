[project]
name = "eci-llm"
version = "0.1.0"
description = "ECI LLM runtime abstraction — provider Protocol + Ollama/OpenAI/Anthropic/OpenRouter adapters."
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "eci-observability",
]

[project.optional-dependencies]
openai = ["openai>=1.40.0"]
anthropic = ["anthropic>=0.34.0"]
all-providers = ["eci-llm[openai,anthropic]"]

[tool.uv.sources]
eci-observability = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eci_llm"]
