[project]
name = "eci-observability"
version = "0.1.0"
description = "ECI observability spine: traces, metrics, logs, Langfuse."
requires-python = ">=3.12,<3.13"
dependencies = [
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "prometheus-client>=0.20.0",
    "structlog>=24.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    # langfuse is optional at runtime; we fail soft if it is not installed
    "langfuse>=2.50.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eci_observability"]
