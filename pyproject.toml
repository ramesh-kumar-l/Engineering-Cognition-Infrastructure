[project]
name = "eci"
version = "0.1.0"
description = "Engineering Cognition Infrastructure — workspace root."
requires-python = ">=3.12,<3.13"

[tool.uv.workspace]
members = ["apps/api", "packages/*"]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "mkdocs-material>=9.5.0",
    "types-requests",
    "pip-audit>=2.7.0",
    "bandit[toml]>=1.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "S", "C4", "PT", "RET", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "PT011"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["apps", "packages"]
addopts = "-ra -q --strict-markers"
markers = [
    "integration: requires a running Postgres (set ECI_TEST_DB_URL)",
    "llm_integration: requires a running Ollama instance (set ECI_LLM_OLLAMA_HOST)",
    "slow: slow test, skipped by default in CI quick lane",
]
asyncio_mode = "auto"
